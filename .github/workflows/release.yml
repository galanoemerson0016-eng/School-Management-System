name: Build, Release and Deploy
 
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag in v<version> format
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS App
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Validate release version and tag
        working-directory: app
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          npm run release:check
          npm run release:check-tag

      - name: Run tests
        working-directory: app
        run: npm test

      - name: Build macOS installers
        working-directory: app
        run: npm run electron:build:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            app/release/*.dmg
            app/release/*.zip
            app/release/latest-mac.yml
          retention-days: 1

  build-win:
    name: Build Windows App
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Validate release version and tag
        working-directory: app
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          npm run release:check
          npm run release:check-tag

      - name: Run tests
        working-directory: app
        run: npm test

      - name: Build Windows installers
        working-directory: app
        run: npm run electron:build:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            app/release/*.exe
            app/release/latest.yml
            app/release/*.blockmap
          retention-days: 1

  release-deploy:
    name: Release & Deploy
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate release version and tag
        working-directory: app
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          npm run release:check
          npm run release:check-tag

      - name: Create release directory
        run: mkdir -p app/release

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: app/release

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: app/release

      - name: Verify mandatory release artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          required_patterns=(
            'app/release/*.exe'
            'app/release/latest.yml'
            'app/release/*.dmg'
            'app/release/*.zip'
            'app/release/latest-mac.yml'
          )

          for pattern in "${required_patterns[@]}"; do
            files=( $pattern )
            if (( ${#files[@]} == 0 )); then
              echo "Missing mandatory release artifact: $pattern" >&2
              exit 1
            fi
          done

      - name: Run CI/CD asset patching and renaming
        run: node app/scripts/patch-metadata-ci.cjs

      - name: Extract version from tag
        id: get_version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: echo "VERSION=${RELEASE_TAG#v}" >> $GITHUB_OUTPUT

      # The app's generic updater URL redirects to the public GitHub Release
      # "latest" assets. Keep that live pointer unchanged while this job stages
      # metadata under immutable version paths and creates non-public drafts.
      - name: Stage Private GitHub Release Draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: FormEase Pro v${{ steps.get_version.outputs.VERSION }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            app/release/*.dmg
            app/release/*.zip
            app/release/*.exe
            app/release/*.yml
            app/release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage Public GitHub Release Draft
        uses: softprops/action-gh-release@v2
        with:
          repository: galanoemerson0016-eng/FormEase-Releases
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: FormEase Pro v${{ steps.get_version.outputs.VERSION }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            app/release/*.dmg
            app/release/*.zip
            app/release/*.exe
            app/release/*.yml
            app/release/*.blockmap

      # These deployments publish only versioned staging metadata. They do not
      # replace updates/latest*.yml or otherwise advance the live updater pointer.
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Update Server to Firebase Hosting
        working-directory: update-server
        run: firebase deploy --only hosting --project formease-app-a3e68
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Install Licensing Portal dependencies
        working-directory: license-portal
        run: npm ci

      - name: Build Licensing Portal website
        working-directory: license-portal
        run: npm run build

      - name: Deploy Licensing Portal to Firebase Hosting
        working-directory: license-portal
        run: firebase deploy --only hosting --project formease-licensing
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Publish Private GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: '${{ inputs.release_tag || github.ref_name }}',
            });
            if (!release.data.draft) {
              throw new Error('The private release must still be a draft before publication.');
            }
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              draft: false,
            });

      - name: Publish Public GitHub Release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASE_REPO_TOKEN }}
          script: |
            const release = await github.rest.repos.getReleaseByTag({
              owner: 'galanoemerson0016-eng',
              repo: 'FormEase-Releases',
              tag: '${{ inputs.release_tag || github.ref_name }}',
            });
            if (!release.data.draft) {
              throw new Error('The public release must still be a draft before publication.');
            }
            await github.rest.repos.updateRelease({
              owner: 'galanoemerson0016-eng',
              repo: 'FormEase-Releases',
              release_id: release.data.id,
              draft: false,
            });
            const published = await github.rest.repos.getReleaseByTag({
              owner: 'galanoemerson0016-eng',
              repo: 'FormEase-Releases',
              tag: '${{ inputs.release_tag || github.ref_name }}',
            });
            if (published.data.draft || !published.data.assets.some((asset) => asset.name === 'latest.yml') || !published.data.assets.some((asset) => asset.name === 'latest-mac.yml')) {
              throw new Error('The public release or its required updater metadata is not available.');
            }
            const response = await fetch(published.data.html_url);
            if (!response.ok) {
              throw new Error(`Published public release is not reachable: ${response.status}.`);
            }

      # 2.5 Auto-Purge Old Releases & Upload New Assets to Google Drive
      - name: Auto-Sync Release to Google Drive
        # Google Drive is an optional mirror. Its failure is reported but must
        # not retroactively mark an already-published release as failed.
        continue-on-error: true
        working-directory: app
        run: npm run sync:gdrive
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
