<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FormEase Cloud Backup Authentication</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      padding: 50px 20px;
      background-color: #f8fafc;
      color: #334155;
    }
    .card {
      background: white;
      max-width: 400px;
      margin: 0 auto;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }
    h2 {
      color: #4f46e5;
      margin-top: 0;
    }
    p {
      font-size: 14px;
      line-height: 1.5;
    }
    .spinner {
      border: 4px solid rgba(0,0,0,.1);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border-left-color: #4f46e5;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <h2>FormEase Pro</h2>
    <div class="spinner"></div>
    <p><strong>Authentication Successful!</strong></p>
    <p>Connecting back to the FormEase Pro desktop application...</p>
    <p style="color: #94a3b8; font-size: 12px;">This window will close automatically.</p>
  </div>
</body>
</html>
